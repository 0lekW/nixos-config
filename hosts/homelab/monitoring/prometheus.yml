global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets:
          - "192.168.1.200:9100" # homelab
          - "192.168.1.201:9100" # zfs

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]        # homelab (docker DNS)
      - targets: ["192.168.1.201:8089"]   # zfs (LAN)
