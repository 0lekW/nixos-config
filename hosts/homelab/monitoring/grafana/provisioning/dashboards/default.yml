apiVersion: 1
providers:
  - name: nixos-config
    orgId: 1
    type: file
    disableDeletion: false
    # Dashboards are owned by the repo. To change one: edit in the UI,
    # export the JSON, overwrite the file here, rebuild.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
